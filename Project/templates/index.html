<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autocorrector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>AI Autocorrector</h1>
        <form method="POST">
            <textarea name="text" placeholder="Type something..." required></textarea><br>
            <button type="submit">Correct</button>
        </form>
        {% if corrected %}
        <h3>Corrected Text:</h3>
        <p class="output">{{ corrected }}</p>
        {% endif %}
    </div>
</body>
</html>
